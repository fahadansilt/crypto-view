<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quant Terminal</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%232563eb'/%3E%3Cstop offset='100%25' stop-color='%230b0e14'/%3E%3C/linearGradient%3E%3ClinearGradient id='l' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%2300f2fe'/%3E%3Cstop offset='100%25' stop-color='%234facfe'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23b)'/%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='none' stroke='rgba(255,255,255,0.2)' stroke-width='1.5'/%3E%3Cline x1='8' y1='14' x2='8' y2='24' stroke='rgba(56,189,248,0.5)' stroke-width='1.2' stroke-linecap='round'/%3E%3Crect x='6.5' y='17' width='3' height='5' rx='1' fill='rgba(56,189,248,0.6)'/%3E%3Cline x1='15' y1='9' x2='15' y2='23' stroke='white' stroke-width='1.2' stroke-linecap='round'/%3E%3Crect x='13.25' y='12' width='3.5' height='7' rx='1' fill='white'/%3E%3Cpath d='M6 21l6-5 5 3 8.5-10.5' stroke='url(%23l)' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25.5' cy='8.5' r='3.2' fill='%2338bdf8' fill-opacity='0.35'/%3E%3Ccircle cx='25.5' cy='8.5' r='1.8' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono:wght@400;500&family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=Instrument+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand" title="Quant Terminal">
          <svg class="brand-logo" viewBox="0 0 32 32" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2563eb" />
                <stop offset="100%" stop-color="#0b0e14" />
              </linearGradient>
              <linearGradient id="brandLine" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#00f2fe" />
                <stop offset="100%" stop-color="#4facfe" />
              </linearGradient>
            </defs>
            <rect width="32" height="32" rx="8" fill="url(#brandBg)" />
            <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
            <line x1="8" y1="14" x2="8" y2="24" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2" stroke-linecap="round" />
            <rect x="6.5" y="17" width="3" height="5" rx="1" fill="rgba(56, 189, 248, 0.55)" />
            <line x1="15" y1="9" x2="15" y2="23" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.2" stroke-linecap="round" />
            <rect x="13.25" y="12" width="3.5" height="7" rx="1" fill="#ffffff" />
            <path d="M6 21 L12 16 L17 19 L25.5 8.5" stroke="url(#brandLine)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="25.5" cy="8.5" r="3.2" fill="#38bdf8" fill-opacity="0.35" />
            <circle cx="25.5" cy="8.5" r="1.8" fill="#ffffff" />
          </svg>
          <span class="brand-text">Crypto<span class="brand-accent">View</span></span>
        </div>
        <button
          id="symbolBtn"
          class="tb symbol-btn"
          title="Change symbol (or just start typing)"
        >
          <span id="symbolLabel">BTCUSDT</span>
          <svg class="dropdown-arrow" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button id="favouriteBtn" class="tb favourite-toggle" type="button" aria-label="Mark current symbol as favourite" aria-pressed="false" title="Mark current symbol as favourite"></button>
        <div class="sep"></div>
        <div id="tfButtons" class="tf-group"></div>
        <input
          id="tfCustom"
          class="tf-custom"
          placeholder="7m"
          title="Any timeframe: 1s, 7m, 2h, 3D, 2W, 3M"
          size="4"
        />
        <div class="sep"></div>
        <select id="chartType" class="tb" title="Chart type"></select>
        <button id="indicatorsBtn" class="tb" title="Indicators">
          <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 6-8 3 3" /></svg><span>Indicators</span>
        </button>
        <button id="compareBtn" class="tb" title="Compare symbols">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8" />
            <path d="M12 6v12M6 12h12" /></svg><span>Compare</span>
        </button>
        <div class="sep"></div>
        <select id="layoutSel" class="tb" title="Chart layout">
          <option value="1">1 chart</option>
          <option value="2v">2 side by side</option>
          <option value="2h">2 stacked</option>
          <option value="3">3 charts</option>
          <option value="4">4 charts</option>
          <option value="6">6 charts</option>
          <option value="8">8 charts</option>
          <option value="16">16 charts</option>
        </select>
        <label class="tb check" title="Change the symbol on every chart at once"
          ><input type="checkbox" id="syncSymbol" /> <span>Sync</span></label
        >
        <button id="replayBtn" class="tb" title="Bar replay">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4" /></svg><span>Replay</span>
        </button>
        <button id="alertBtn" class="tb" title="Create alert">
          <svg viewBox="0 0 24 24">
            <path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 20h4" /></svg><span>Alert</span>
        </button>
      </div>

      <div class="topbar-right">
        <button id="shortcutsBtn" class="tb" title="Keyboard shortcuts (?)">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" /><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10" stroke-linecap="round" /></svg><span>Shortcuts</span>
        </button>
        <button id="logBtn" class="tb" title="Logarithmic price scale">Log</button>
        <button id="snapBtn" class="tb icon" title="Download chart image">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="6" width="18" height="14" rx="2" />
            <circle cx="12" cy="13" r="3.5" />
            <path d="M8 6l2-3h4l2 3" />
          </svg>
        </button>
        <button id="csvBtn" class="tb icon" title="Export chart data (CSV)">
          <svg viewBox="0 0 24 24">
            <path d="M12 4v11M7 10l5 5 5-5M5 20h14" />
          </svg>
        </button>
        <button id="settingsBtn" class="tb icon" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button id="themeBtn" class="tb icon" title="Light / dark">
          <svg viewBox="0 0 24 24">
            <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
          </svg>
        </button>
        <span id="status" class="status" title="Data status"></span>
        <button id="logoutBtn" class="tb logout-btn hidden" type="button" title="Sign out">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Sign out</span>
        </button>
      </div>
    </header>

    <div class="main">
      <nav class="drawbar" id="drawbar"></nav>
      <section class="center">
        <div id="grid" class="grid"></div>
        <div id="bottom" class="bottom collapsed">
          <div class="tabs" id="bottomTabs">
            <button data-tab="tester" class="active">Strategy tester</button>
            <button data-tab="screener">Screener</button>
            <button data-tab="heatmap">Heatmap</button>
            <button data-tab="seasonals">Seasonals</button>
            <button data-tab="financials">Financials</button>
            <button data-tab="paper">Paper trading</button>
            <button data-tab="editor">Indicator editor</button>
          <button data-tab="ptq">PTQ</button>
            <div class="spacer"></div>
            <button id="bottomToggle" class="icon" title="Show / hide panel">
              <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" /></svg>
            </button>
          </div>
          <div class="tab-body" id="bottomBody"></div>
        </div>
      </section>
      <aside class="side" id="sideBar">
        <div class="tabs" id="sideTabs">
          <button data-tab="watchlist" class="active">Watchlist</button>
          <button data-tab="alerts">Alerts</button>
          <button data-tab="calendar">Calendar</button>
          <button data-tab="news">News</button>
          <div class="spacer"></div>
          <button id="sideToggle" class="icon" title="Collapse sidebar">
            <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
        <div class="tab-body" id="sideBody"></div>
      </aside>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-card" id="modalCard"></div>
    </div>
    <div id="toasts" class="toasts"></div>

    <script src="/vendor/lightweight-charts.standalone.production.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
